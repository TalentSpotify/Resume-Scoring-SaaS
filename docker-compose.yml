version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=ap-south-1
      - S3_BUCKET=resume-scoring-app-bucket
      - BEDROCK_MODEL_ID=anthropic.claude-3-5-sonnet-20240620-v1:0
      - CORS_ORIGINS=http://localhost:3000
      - LOG_LEVEL=INFO
    volumes:
      - ~/.aws:/root/.aws:ro

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
