services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    env_file:
      - ./backend/.env
    volumes:
      - ~/.aws:/root/.aws:ro

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
